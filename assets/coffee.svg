<!-- ========================= -->
<!-- IDE / TERMINAL -->
<!-- ========================= -->

<!-- Terminal window -->
<rect
  x="100"
  y="120"
  width="88"
  height="78"
  rx="8"
  fill="#0D1117"
  stroke="#30363D"
  stroke-width="2"
/>

<!-- Top bar -->
<circle cx="110" cy="130" r="2.4" fill="#FF7B72"/>
<circle cx="118" cy="130" r="2.4" fill="#E3B341"/>
<circle cx="126" cy="130" r="2.4" fill="#7EE787"/>

<!-- File name -->
<text
  x="145"
  y="132"
  text-anchor="middle"
  font-family="monospace"
  font-size="5.5"
  fill="#8B949E">
  coffee.c
</text>

<!-- Divider -->
<line
  x1="104"
  y1="138"
  x2="184"
  y2="138"
  stroke="#21262D"
  stroke-width="1"
/>

<!-- Line numbers -->
<g
  font-family="monospace"
  font-size="5"
  fill="#484F58">

  <text x="105" y="150">1</text>
  <text x="105" y="160">2</text>
  <text x="105" y="170">3</text>
  <text x="105" y="180">4</text>
  <text x="105" y="190">5</text>

</g>

<!-- CODE -->

<!-- 1: while ( -->
<text
  x="114"
  y="150"
  font-family="monospace"
  font-size="5.3">

  <tspan fill="#FF7B72">while</tspan>
  <tspan fill="#C9D1D9"> (</tspan>

</text>

<!-- 2: coffee < FULL -->
<text
  x="120"
  y="160"
  font-family="monospace"
  font-size="5.3">

  <tspan fill="#79C0FF">coffee</tspan>
  <tspan fill="#C9D1D9"> </tspan>
  <tspan fill="#FF7B72">&lt;</tspan>
  <tspan fill="#C9D1D9"> </tspan>
  <tspan fill="#D2A8FF">FULL</tspan>

</text>

<!-- 3: ) { -->
<text
  x="114"
  y="170"
  font-family="monospace"
  font-size="5.3"
  fill="#C9D1D9">
  ) {
</text>

<!-- 4: coffee++; -->
<text
  x="120"
  y="180"
  font-family="monospace"
  font-size="5.3">

  <tspan fill="#79C0FF">coffee</tspan>
  <tspan fill="#7EE787">++</tspan>
  <tspan fill="#C9D1D9">;</tspan>

</text>

<!-- 5: } -->
<text
  x="114"
  y="190"
  font-family="monospace"
  font-size="5.3"
  fill="#C9D1D9">
  }
</text>

<!-- Blinking cursor -->
<rect
  x="151"
  y="174"
  width="4"
  height="7"
  rx="0.5"
  fill="#58A6FF"
  filter="url(#glow)">

  <animate
    attributeName="opacity"
    values="1;0;1"
    dur="0.8s"
    repeatCount="indefinite"/>

</rect>
