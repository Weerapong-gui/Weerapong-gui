<svg width="260" height="260" viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Steam 1 -->
  <path d="M95 95 C80 78,105 62,92 38" stroke="#8B949E" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite"></animate>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 -10" dur="2.4s" repeatCount="indefinite"></animateTransform>
  </path>

  <!-- Steam 2 -->
  <path d="M130 92 C116 74,142 58,128 32" stroke="#8B949E" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"></animate>
    <animateTransform attributeName="transform" type="translate" values="0 12;0 -12" dur="2s" repeatCount="indefinite"></animateTransform>
  </path>

  <!-- Steam 3 -->
  <path d="M165 95 C150 78,175 62,162 38" stroke="#8B949E" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0;0.85;0" dur="2.8s" repeatCount="indefinite"></animate>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 -10" dur="2.8s" repeatCount="indefinite"></animateTransform>
  </path>

  <!-- Saucer -->
  <ellipse cx="130" cy="205" rx="72" ry="10" fill="#30363D"></ellipse>

  <!-- Cup body -->
  <path d="M72 110 H188 L180 175 C178 189 168 198 154 198 H106 C92 198 82 189 80 175 L72 110 Z" fill="#F0F6FC" stroke="#C9D1D9" stroke-width="3"></path>

  <!-- Coffee surface -->
  <ellipse cx="130" cy="110" rx="58" ry="12" fill="#6F4E37"></ellipse>

  <!-- Cup rim -->
  <ellipse cx="130" cy="110" rx="58" ry="12" stroke="#C9D1D9" stroke-width="3"></ellipse>

  <!-- Handle -->
  <path d="M188 125
           C215 122 222 142 220 155
           C218 171 207 182 186 178" stroke="#F0F6FC" stroke-width="12" stroke-linecap="round" fill="none"></path>

  <!-- Small highlight -->
  <path d="M95 125 C92 145 95 165 103 183" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.55"></path>

</svg>