<svg
  xmlns="http://www.w3.org/2000/svg"
  width="420"
  height="220"
  viewBox="0 0 420 220">

  <!-- background -->
  <rect
    x="1"
    y="1"
    width="418"
    height="218"
    rx="16"
    fill="#0D1117"
    stroke="#30363D"
    stroke-width="2"
  />

  <!-- top bar -->
  <rect
    x="1"
    y="1"
    width="418"
    height="42"
    rx="16"
    fill="#161B22"
  />

  <rect
    x="1"
    y="25"
    width="418"
    height="18"
    fill="#161B22"
  />

  <!-- buttons -->
  <circle cx="24" cy="22" r="6" fill="#FF7B72"/>
  <circle cx="44" cy="22" r="6" fill="#E3B341"/>
  <circle cx="64" cy="22" r="6" fill="#7EE787"/>

  <!-- title -->
  <text
    x="210"
    y="27"
    text-anchor="middle"
    font-family="monospace"
    font-size="14"
    fill="#8B949E">
    coffee.c
  </text>

  <!-- divider -->
  <line
    x1="1"
    y1="43"
    x2="419"
    y2="43"
    stroke="#30363D"
  />

  <!-- line numbers -->
  <g
    font-family="monospace"
    font-size="14"
    fill="#484F58">

    <text x="22" y="78">1</text>
    <text x="22" y="104">2</text>
    <text x="22" y="130">3</text>
    <text x="22" y="156">4</text>
    <text x="22" y="182">5</text>
  </g>

  <!-- separator -->
  <line
    x1="48"
    y1="55"
    x2="48"
    y2="192"
    stroke="#21262D"
  />

  <!-- code -->
  <text
    x="68"
    y="78"
    font-family="monospace"
    font-size="15">

    <tspan fill="#FF7B72">while</tspan>
    <tspan fill="#C9D1D9"> (</tspan>
  </text>

  <text
    x="92"
    y="104"
    font-family="monospace"
    font-size="15">

    <tspan fill="#79C0FF">coffee</tspan>
    <tspan fill="#C9D1D9"> </tspan>
    <tspan fill="#FF7B72">&lt;</tspan>
    <tspan fill="#C9D1D9"> </tspan>
    <tspan fill="#D2A8FF">FULL</tspan>
  </text>

  <text
    x="68"
    y="130"
    font-family="monospace"
    font-size="15"
    fill="#C9D1D9">
    ) {
  </text>

  <text
    x="92"
    y="156"
    font-family="monospace"
    font-size="15">

    <tspan fill="#79C0FF">coffee</tspan>
    <tspan fill="#7EE787">++</tspan>
    <tspan fill="#C9D1D9">;</tspan>
  </text>

  <text
    x="68"
    y="182"
    font-family="monospace"
    font-size="15"
    fill="#C9D1D9">
    }
  </text>

</svg>
