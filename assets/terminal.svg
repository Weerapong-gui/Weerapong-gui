        <animate
          attributeName="width"
          values="0;0;12;24;36;48;60;72;84;96;110;110"
          keyTimes="0;.38;.3925;.405;.4175;.43;.4425;.455;.4675;.48;.49;1"
          dur="20s"
          repeatCount="indefinite"/>
