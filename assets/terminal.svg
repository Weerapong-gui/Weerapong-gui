<svg
  xmlns="http://www.w3.org/2000/svg"
  width="500"
  height="260"
  viewBox="0 0 500 260">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="500" y2="260">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path
        d="M24 0 L0 0 0 24"
        fill="none"
        stroke="#30363D"
        stroke-width="0.5"
        opacity="0.18"/>
    </pattern>

    <!-- line 1 -->
    <clipPath id="line1Clip">
      <rect x="76" y="64" width="0" height="28">
        <animate
          attributeName="width"
          values="0;10;20;31;43;43;56;68;68"
          keyTimes="0;.0125;.026;.041;.0575;.10;.1175;.135;1"
          dur="20s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- line 2 -->
    <clipPath id="line2Clip">
      <rect x="102" y="92" width="0" height="28">
        <animate
          attributeName="width"
          values="0;0;12;23;35;47;58;70;82;94;106;118;130;142;154;154"
          keyTimes="0;.15;.1625;.175;.191;.2025;.216;.23;.244;.2575;.27;.2825;.295;.3075;.3225;1"
          dur="20s"
          repeatCount="indefinite"/>
